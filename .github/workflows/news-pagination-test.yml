name: 公式NEWS全ページ検証

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Python準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 必要ライブラリ準備
        run: |
          python -m pip install beautifulsoup4

      - name: 公式NEWS全ページを検証
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          BASE = "https://www.news.cho-kaguyahime.com/"
          DATE_RE = re.compile(
              r"(\d{1,2})月\s*(\d{1,2}),\s*(\d{4})"
          )

          all_articles = []
          seen_urls = set()

          def get_html(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          def extract_articles(html):
              soup = BeautifulSoup(html, "html.parser")
              results = []

              for h2 in soup.find_all("h2"):
                  a = h2.find("a", href=True)

                  if not a:
                      continue

                  title = " ".join(
                      a.get_text(" ", strip=True).split()
                  )

                  url = urljoin(BASE, a["href"])

                  if not title:
                      continue

                  if not url.startswith(BASE):
                      continue

                  if url.rstrip("/") == BASE.rstrip("/"):
                      continue

                  date_text = None
                  node = h2

                  for _ in range(5):
                      if node is None:
                          break

                      text = " ".join(
                          node.get_text(
                              " ",
                              strip=True
                          ).split()
                      )

                      match = DATE_RE.search(text)

                      if match:
                          date_text = match.group(0)
                          break

                      node = node.parent

                  if date_text:
                      results.append(
                          {
                              "title": title,
                              "url": url,
                              "date": date_text
                          }
                      )

              return results

          print("================================")
          print("公式NEWS全ページ検証開始")
          print("================================")
          print("")

          empty_pages = 0

          for page in range(1, 21):

              if page == 1:
                  url = BASE
              else:
                  url = urljoin(
                      BASE,
                      f"page/{page}/"
                  )

              print(f"--- ページ {page} ---")
              print(url)

              try:
                  html = get_html(url)

              except Exception as e:
                  print("ページ取得エラー:", e)
                  break

              articles = extract_articles(html)

              print(
                  "記事データ:",
                  len(articles),
                  "件"
              )

              if not articles:
                  empty_pages += 1
                  print("記事がないため終了します。")
                  print("")
                  break

              for article in articles:

                  if article["url"] in seen_urls:
                      print(
                          "重複:",
                          article["title"]
                      )
                      continue

                  seen_urls.add(article["url"])
                  all_articles.append(article)

                  print(
                      "タイトル:",
                      article["title"]
                  )
                  print(
                      "公開日:",
                      article["date"]
                  )
                  print(
                      "URL:",
                      article["url"]
                  )
                  print("---")

              print("")

          print("================================")
          print("最終結果")
          print("================================")
          print(
              "検証したページ数:",
              page
          )
          print(
              "取得した記事数:",
              len(all_articles)
          )
          print(
              "重複を除いた記事数:",
              len(seen_urls)
          )
          print("")

          missing_dates = [
              a for a in all_articles
              if not a["date"]
          ]

          if missing_dates:
              print(
                  "公開日なし:",
                  len(missing_dates),
                  "件"
              )

          if not all_articles:
              raise SystemExit(
                  "記事を1件も取得できませんでした"
              )

          print("検証結果: SUCCESS")
          PY
