name: 超かぐや姫！公式NEWS取得テスト

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 必要ファイルを確認
        run: |
          test -f collector.py
          test -f data.json

      - name: 公式NEWS取得テスト
        run: |
          python collector.py

      - name: 結果を確認
        run: |
          python - <<'PY'
          import json

          with open("data.json", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("items", [])

          print("登録情報数:", len(items))

          news = [
              x for x in items
              if x.get("category") == "公式NEWS"
          ]

          print("公式NEWS情報数:", len(news))

          if len(news) == 0:
              raise SystemExit(
                  "公式NEWSの記事を1件も取得できませんでした"
              )

          print("取得テスト成功")
          PY
