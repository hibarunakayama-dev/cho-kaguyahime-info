name: 超かぐや姫！情報自動収集

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 必要ライブラリ準備
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4

      - name: 情報を収集
        run: |
          python collector.py

      - name: 変更を確認
        id: changes
        run: |
          if git diff --quiet -- data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "新しい情報はありませんでした"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "data.jsonに変更があります"
          fi

      - name: Git設定
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: data.jsonを保存
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add data.json
          git commit -m "Update official NEWS data"
          git push

      - name: 完了
        run: |
          echo "================================"
          echo "超かぐや姫！情報自動収集 完了"
          echo "================================"
