name: 公式NEWS記事取得テスト

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 公式NEWSを取得
        run: |
          python - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          url = "https://www.news.cho-kaguyahime.com/"

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      attrs = dict(attrs)
                      href = attrs.get("href")
                      if href:
                          self.current = [urljoin(url, href), ""]

              def handle_data(self, data):
                  if self.current:
                      self.current[1] += data

              def handle_endtag(self, tag):
                  if tag == "a" and self.current:
                      title = " ".join(self.current[1].split())
                      link = self.current[0]

                      if title and link.startswith(
                          "https://www.news.cho-kaguyahime.com/"
                      ):
                          self.links.append((title, link))

                      self.current = None

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode(
                  "utf-8",
                  errors="replace"
              )

          print("公式NEWS取得: OK")
          print("HTMLサイズ:", len(html), "bytes")

          parser = Parser()
          parser.feed(html)

          print("検出リンク数:", len(parser.links))
          print("")
          print("検出した記事候補:")

          for title, link in parser.links[:20]:
              print("タイトル:", title)
              print("URL:", link)
              print("---")

          if not parser.links:
              raise SystemExit(
                  "記事候補を検出できませんでした"
              )

          print("診断結果: SUCCESS")
          PY
