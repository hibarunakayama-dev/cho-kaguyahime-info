name: 本番収集前安全テスト

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 必要ライブラリ準備
        run: |
          python -m pip install beautifulsoup4

      - name: 既存データを確認
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("data.json").read_text(
                  encoding="utf-8"
              )
          )

          items = data.get("items", [])

          print("既存データ件数:", len(items))
          print("既存データのJSON形式: OK")

          if not isinstance(items, list):
              raise SystemExit(
                  "data.json のitemsが配列ではありません"
              )
          PY

      - name: 公式NEWSを全ページ取得
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          BASE = "https://www.news.cho-kaguyahime.com/"

          DATE_RE = re.compile(
              r"(\d{1,2})月\s*(\d{1,2}),\s*(\d{4})"
          )

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "cho-kaguyahime-info/1.0"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          def extract(html):
              soup = BeautifulSoup(
                  html,
                  "html.parser"
              )

              articles = []

              for h2 in soup.find_all("h2"):
                  a = h2.find("a", href=True)

                  if not a:
                      continue

                  title = " ".join(
                      a.get_text(
                          " ",
                          strip=True
                      ).split()
                  )

                  url = urljoin(
                      BASE,
                      a["href"]
                  )

                  if not title:
                      continue

                  if not url.startswith(BASE):
                      continue

                  date_text = None
                  node = h2

                  for _ in range(5):
                      if node is None:
                          break

                      text = " ".join(
                          node.get_text(
                              " ",
                              strip=True
                          ).split()
                      )

                      match = DATE_RE.search(text)

                      if match:
                          date_text = match.group(0)
                          break

                      node = node.parent

                  if date_text:
                      articles.append({
                          "title": title,
                          "url": url,
                          "date": date_text
                      })

              return articles

          all_articles = []
          seen = set()

          for page in range(1, 21):

              if page == 1:
                  url = BASE
              else:
                  url = urljoin(
                      BASE,
                      f"page/{page}/"
                  )

              print("")
              print("===== ページ", page, "=====")
              print(url)

              try:
                  html = fetch(url)
              except Exception as e:
                  print(
                      "取得終了:",
                      type(e).__name__,
                      str(e)
                  )
                  break

              articles = extract(html)

              print(
                  "記事数:",
                  len(articles)
              )

              if not articles:
                  print(
                      "記事がないため終了"
                  )
                  break

              for article in articles:
                  if article["url"] in seen:
                      continue

                  seen.add(article["url"])
                  all_articles.append(article)

          print("")
          print("==============================")
          print("安全テスト結果")
          print("==============================")
          print(
              "取得記事数:",
              len(all_articles)
          )
          print(
              "重複除外後:",
              len(seen)
          )

          if not all_articles:
              raise SystemExit(
                  "記事を取得できませんでした"
              )

          missing = [
              a for a in all_articles
              if not a["title"]
              or not a["url"]
              or not a["date"]
          ]

          print(
              "タイトル/URL/公開日不足:",
              len(missing)
          )

          if missing:
              raise SystemExit(
                  "不完全な記事データがあります"
              )

          print("")
          print("検証結果: SUCCESS")
          PY

      - name: data.jsonを変更していないことを確認
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json: 変更なし"
          else
            echo "ERROR: data.jsonが変更されています"
            git diff -- data.json
            exit 1
          fi

      - name: collector.pyを変更していないことを確認
        run: |
          if git diff --quiet -- collector.py; then
            echo "collector.py: 変更なし"
          else
            echo "ERROR: collector.pyが変更されています"
            git diff -- collector.py
            exit 1
          fi

      - name: 最終確認
        run: |
          echo "================================"
          echo "本番収集前安全テスト SUCCESS"
          echo "data.jsonは変更されていません"
          echo "collector.pyは変更されていません"
          echo "================================"
