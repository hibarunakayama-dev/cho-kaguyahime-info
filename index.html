<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ツクヨミ情報センター</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --night: #070d29;
  --night2: #101a43;
  --night3: #182653;
  --moon: #fff4c7;
  --moon2: #ead99b;
  --gold: #cbb77a;
  --gold2: #9f8a55;
  --paper: #f4f0df;
  --paper2: #e8e0c8;
  --ink: #25253a;
  --mist: rgba(205,215,238,.14);
  --mist2: rgba(225,225,255,.08);
  --line: rgba(214,194,126,.55);
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  color: var(--paper);
  background:
    radial-gradient(circle at 80% 10%, rgba(255,244,199,.08), transparent 18%),
    radial-gradient(circle at 15% 35%, rgba(112,130,210,.12), transparent 28%),
    linear-gradient(180deg, #060b25 0%, #0d1638 46%, #111a3e 100%);
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Hiragino Mincho Pro",
    "Noto Serif JP",
    serif;
  min-height: 100vh;
}

/* =========================
   夜空
========================= */

.sky {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.stars {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle, rgba(255,255,235,.9) 1px, transparent 1.5px),
    radial-gradient(circle, rgba(255,245,205,.65) 1px, transparent 1.5px),
    radial-gradient(circle, rgba(255,255,255,.5) 1px, transparent 1.5px);
  background-size: 97px 113px, 151px 137px, 211px 193px;
  background-position: 20px 10px, 60px 40px, 100px 80px;
  opacity: .55;
}

.star-glow {
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #fff7d4;
  box-shadow: 0 0 18px 6px rgba(255,245,194,.3);
}

.star1 { top: 12%; left: 28%; }
.star2 { top: 20%; left: 67%; }
.star3 { top: 34%; left: 42%; width:4px;height:4px; }
.star4 { top: 9%; left: 79%; width:4px;height:4px; }
.star5 { top: 44%; left: 18%; width:4px;height:4px; }

/* 月 */

.moon {
  position: absolute;
  right: 9%;
  top: 54px;
  width: 145px;
  height: 145px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #fffef0 0%, #fff3bc 48%, #dfcb83 100%);
  box-shadow:
    0 0 25px rgba(255,242,181,.55),
    0 0 75px rgba(255,239,175,.22);
}

.moon::before {
  content: "";
  position: absolute;
  width: 110px;
  height: 110px;
  left: -66px;
  top: 18px;
  border-radius: 50%;
  background: var(--night);
  box-shadow: -15px 0 0 rgba(245,229,171,.25);
}

/* 雲・霞 */

.cloud {
  position: absolute;
  height: 45px;
  border-radius: 50%;
  background: rgba(166,180,225,.10);
  filter: blur(2px);
}

.cloud1 {
  width: 330px;
  left: -80px;
  top: 270px;
}

.cloud2 {
  width: 430px;
  right: -120px;
  top: 310px;
}

.cloud3 {
  width: 260px;
  left: 35%;
  top: 420px;
  opacity: .45;
}

/* =========================
   メイン
========================= */

.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
}

/* =========================
   ヘッダー
========================= */

.hero {
  min-height: 365px;
  padding: 46px 28px 60px;
  text-align: center;
  position: relative;
  border-bottom: 1px solid rgba(210,190,125,.35);
  background:
    linear-gradient(
      180deg,
      rgba(5,10,35,.18),
      rgba(12,23,57,.55)
    );
}

.hero-small {
  font-size: 14px;
  letter-spacing: .65em;
  color: #d8c990;
  margin: 8px 0 30px;
}

.hero h1 {
  margin: 0;
  font-size: clamp(42px, 7vw, 78px);
  font-weight: 400;
  letter-spacing: .17em;
  color: #fff7da;
  text-shadow:
    0 0 10px rgba(255,243,188,.16),
    0 4px 20px rgba(0,0,0,.45);
}

.hero-sub {
  margin: 25px auto 0;
  font-size: clamp(14px, 2vw, 20px);
  letter-spacing: .2em;
  color: #ddd4ae;
}

/* =========================
   中央領域
========================= */

.layout {
  width: min(1450px, calc(100% - 40px));
  margin: 10px auto 70px;
  display: grid;
  grid-template-columns: 245px minmax(0, 1fr) 265px;
  gap: 20px;
  align-items: start;
}

/* =========================
   左：案内
========================= */

.side {
  border: 1px solid var(--line);
  background:
    linear-gradient(
      180deg,
      rgba(8,17,49,.92),
      rgba(8,14,38,.86)
    );
  box-shadow: 0 15px 40px rgba(0,0,0,.22);
}

.side-title {
  padding: 24px 22px;
  border-bottom: 1px solid rgba(203,183,122,.35);
  font-size: 20px;
  letter-spacing: .15em;
}

.nav {
  padding: 10px;
}

.nav button {
  width: 100%;
  border: 0;
  background: transparent;
  color: #d9d4bf;
  text-align: left;
  padding: 14px 13px;
  font-family: inherit;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  border-radius: 2px;
}

.nav button:hover,
.nav button.active {
  background: rgba(203,183,122,.16);
  color: #fff1bc;
}

/* =========================
   中央：月の間
========================= */

.center {
  min-width: 0;
}

.intro {
  min-height: 215px;
  border: 1px solid var(--line);
  padding: 40px;
  background:
    radial-gradient(
      circle at 75% 35%,
      rgba(255,239,177,.13),
      transparent 28%
    ),
    linear-gradient(
      120deg,
      rgba(24,28,72,.94),
      rgba(39,34,91,.82)
    );
  position: relative;
  overflow: hidden;
}

.intro::after {
  content: "月";
  position: absolute;
  right: 65px;
  bottom: -38px;
  font-size: 160px;
  color: rgba(238,226,174,.06);
  font-weight: 400;
}

.intro h2 {
  position: relative;
  z-index: 1;
  margin: 0 0 20px;
  font-size: 30px;
  font-weight: 400;
  letter-spacing: .14em;
}

.intro p {
  position: relative;
  z-index: 1;
  margin: 0;
  line-height: 2.1;
  color: #d7d4c5;
  font-size: 15px;
}

/* =========================
   検索
========================= */

.search-panel {
  margin-top: 20px;
  padding: 18px;
  background: rgba(239,235,214,.95);
  border: 1px solid rgba(202,181,116,.65);
}

.search-row {
  display: grid;
  grid-template-columns: 1fr 220px;
  gap: 12px;
}

input,
select {
  width: 100%;
  height: 58px;
  border: 1px solid #c8bd9b;
  background: #f8f5e9;
  color: #29283a;
  padding: 0 18px;
  font-family: inherit;
  font-size: 15px;
  outline: none;
}

input:focus,
select:focus {
  border-color: #9d8750;
  box-shadow: 0 0 0 2px rgba(157,135,80,.12);
}

/* =========================
   記事一覧
========================= */

.results {
  margin-top: 20px;
  display: grid;
  gap: 12px;
}

.result-card {
  background: rgba(244,240,223,.97);
  color: var(--ink);
  border-left: 3px solid var(--gold);
  padding: 22px 24px;
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
  transition: transform .2s, background .2s;
}

.result-card:hover {
  transform: translateY(-2px);
  background: #fffdf3;
}

.result-meta {
  font-size: 12px;
  color: #817655;
  letter-spacing: .08em;
  margin-bottom: 9px;
}

.result-title {
  margin: 0;
  font-size: 19px;
  line-height: 1.7;
  font-weight: 500;
}

.result-title a {
  color: #27243a;
  text-decoration: none;
}

.result-title a:hover {
  color: #796332;
}

.result-summary {
  margin: 10px 0 0;
  color: #5c5960;
  font-size: 13px;
  line-height: 1.8;
}

.result-source {
  margin-top: 12px;
  font-size: 12px;
  color: #8d7743;
}

/* =========================
   右：月の記録
========================= */

.record {
  background:
    linear-gradient(
      180deg,
      rgba(250,247,235,.98),
      rgba(233,226,202,.98)
    );
  color: #28263a;
  border: 1px solid rgba(203,183,122,.75);
  box-shadow: 0 15px 40px rgba(0,0,0,.2);
}

.record-section {
  padding: 23px 22px;
  border-bottom: 1px solid rgba(128,108,63,.18);
}

.record-title {
  margin: 0 0 20px;
  font-size: 17px;
  letter-spacing: .1em;
}

.big-number {
  font-size: 43px;
  font-family: Georgia, serif;
  color: #25233a;
}

.record-caption {
  margin-top: 3px;
  font-size: 12px;
  color: #6e6759;
}

.source-line {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0;
  font-size: 13px;
  border-bottom: 1px dotted rgba(70,60,40,.2);
}

.source-line:last-child {
  border-bottom: 0;
}

/* =========================
   状態
========================= */

.status {
  margin: 15px 0;
  color: #cfc8ad;
  font-size: 13px;
}

.empty {
  padding: 45px;
  text-align: center;
  border: 1px solid rgba(203,183,122,.35);
  color: #cfc8ad;
}

footer {
  text-align: center;
  padding: 30px 20px 55px;
  color: #9e9b8e;
  font-size: 12px;
  letter-spacing: .12em;
}

/* =========================
   スマホ
========================= */

@media (max-width: 1050px) {
  .layout {
    grid-template-columns: 210px minmax(0,1fr);
  }

  .record {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .record-section {
    border-bottom: 1px solid rgba(128,108,63,.18);
  }
}

@media (max-width: 760px) {
  .hero {
    min-height: 300px;
    padding-top: 38px;
  }

  .hero h1 {
    font-size: 39px;
    letter-spacing: .08em;
  }

  .hero-small {
    font-size: 11px;
    letter-spacing: .4em;
  }

  .moon {
    width: 90px;
    height: 90px;
    right: 5%;
    top: 65px;
  }

  .moon::before {
    width: 70px;
    height: 70px;
    left: -40px;
  }

  .layout {
    width: min(100% - 22px, 700px);
    grid-template-columns: 1fr;
  }

  .side,
  .record {
    grid-column: auto;
  }

  .nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .search-row {
    grid-template-columns: 1fr;
  }

  .intro {
    padding: 28px 23px;
  }

  .intro h2 {
    font-size: 25px;
  }

  .record {
    display: block;
  }
}
</style>
</head>

<body>

<div class="sky">
  <div class="stars"></div>
  <div class="star-glow star1"></div>
  <div class="star-glow star2"></div>
  <div class="star-glow star3"></div>
  <div class="star-glow star4"></div>
  <div class="star-glow star5"></div>

  <div class="moon"></div>

  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
</div>

<div class="page">

<header class="hero">

  <div class="hero-small">つ く よ み　の　も と　へ</div>

  <h1>ツクヨミ情報センター</h1>

  <div class="hero-sub">
    月の光に導かれ、超かぐや姫の記録をひとつに
  </div>

</header>


<main class="layout">

  <!-- 左側 -->

  <aside class="side">

    <div class="side-title">
      ☾　案内
    </div>

    <div class="nav">

      <button class="active" data-filter="all">
        <span>月の間</span>
        <span id="navAll">0</span>
      </button>

      <button data-filter="new">
        <span>新しき情報</span>
        <span id="navNew">0</span>
      </button>

      <button data-filter="ニュース">
        <span>公式NEWS</span>
        <span id="navNews">0</span>
      </button>

      <button data-filter="グッズ">
        <span>形あるもの</span>
        <span id="navGoods">0</span>
      </button>

    </div>

  </aside>


  <!-- 中央 -->

  <section class="center">

    <section class="intro">

      <h2>月の間</h2>

      <p>
        ここは、超かぐや姫にまつわる情報を
        ゆっくりと眺めるための場所です。<br>
        最新のお知らせから過去の記録まで、
        月の光のようにひとつにつないでいます。
      </p>

    </section>


    <section class="search-panel">

      <div class="search-row">

        <input
          id="search"
          type="search"
          placeholder="⌕　情報を探す……"
          autocomplete="off"
        >

        <select id="sort">
          <option value="new">新しい順</option>
          <option value="old">古い順</option>
        </select>

      </div>

    </section>


    <div class="status" id="status">
      月の記録を読み込んでいます……
    </div>

    <section class="results" id="results"></section>

  </section>


  <!-- 右側 -->

  <aside class="record">

    <section class="record-section">

      <h3 class="record-title">月の記録</h3>

      <div class="big-number" id="totalCount">0</div>

      <div class="record-caption">
        登録されている情報
      </div>

    </section>


    <section class="record-section">

      <h3 class="record-title">情報源</h3>

      <div id="sources"></div>

    </section>

  </aside>

</main>


<footer>
  ツクヨミ情報センター
</footer>

</div>


<script>
"use strict";

let allItems = [];
let currentFilter = "all";

const searchBox = document.getElementById("search");
const sortBox = document.getElementById("sort");
const results = document.getElementById("results");
const status = document.getElementById("status");

const totalCount = document.getElementById("totalCount");
const sourcesBox = document.getElementById("sources");

const navAll = document.getElementById("navAll");
const navNew = document.getElementById("navNew");
const navNews = document.getElementById("navNews");
const navGoods = document.getElementById("navGoods");


/* =========================
   data.json 読み込み
========================= */

async function loadData() {

  try {

    const response = await fetch("./data.json?ts=" + Date.now(), {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("data.json を取得できませんでした");
    }

    const data = await response.json();

    if (!data || !Array.isArray(data.items)) {
      throw new Error("data.json の形式が正しくありません");
    }

    allItems = data.items
      .filter(item => item && item.title && item.url)
      .map(item => ({
        date: item.date || "",
        category: item.category || "その他",
        title: item.title || "",
        summary: item.summary || "",
        source: item.source || "情報源不明",
        url: item.url || ""
      }));

    updateCounts();
    render();

    status.textContent =
      "月の記録 " + allItems.length + " 件";

  } catch (error) {

    console.error(error);

    status.textContent =
      "月の記録を読み込めませんでした。data.jsonをご確認ください。";

    results.innerHTML = `
      <div class="empty">
        情報を読み込めませんでした。
      </div>
    `;
  }
}


/* =========================
   件数計算
========================= */

function updateCounts() {

  totalCount.textContent = allItems.length;

  navAll.textContent = allItems.length;

  /*
   * 新しき情報
   * 最新7件を表示対象として数える
   */
  const sorted = [...allItems].sort(
    (a,b) => String(b.date).localeCompare(String(a.date))
  );

  navNew.textContent =
    Math.min(7, sorted.length);

  /*
   * 「ニュース」というカテゴリーの実数
   */
  navNews.textContent =
    allItems.filter(item =>
      item.category === "ニュース"
    ).length;

  navGoods.textContent =
    allItems.filter(item =>
      item.category === "グッズ"
    ).length;


  /*
   * 情報源別件数
   */

  const sourceCounts = {};

  allItems.forEach(item => {

    const source = item.source || "情報源不明";

    sourceCounts[source] =
      (sourceCounts[source] || 0) + 1;

  });


  sourcesBox.innerHTML = "";

  Object.entries(sourceCounts)
    .sort((a,b) => b[1] - a[1])
    .forEach(([source,count]) => {

      const row = document.createElement("div");

      row.className = "source-line";

      row.innerHTML = `
        <span>${escapeHtml(source)}</span>
        <strong>${count}</strong>
      `;

      sourcesBox.appendChild(row);

    });
}


/* =========================
   表示
========================= */

function render() {

  const keyword =
    searchBox.value.trim().toLowerCase();

  let items = [...allItems];


  /*
   * フィルター
   */

  if (currentFilter === "ニュース") {

    items = items.filter(
      item => item.category === "ニュース"
    );

  } else if (currentFilter === "グッズ") {

    items = items.filter(
      item => item.category === "グッズ"
    );

  } else if (currentFilter === "new") {

    items.sort(
      (a,b) =>
        String(b.date).localeCompare(String(a.date))
    );

    items = items.slice(0,7);

  }


  /*
   * 検索
   */

  if (keyword) {

    items = items.filter(item => {

      const text = [
        item.title,
        item.summary,
        item.source,
        item.category,
        item.date
      ].join(" ").toLowerCase();

      return text.includes(keyword);

    });

  }


  /*
   * 並び順
   */

  items.sort((a,b) => {

    const da = String(a.date);
    const db = String(b.date);

    if (sortBox.value === "old") {
      return da.localeCompare(db);
    }

    return db.localeCompare(da);

  });


  /*
   * 描画
   */

  results.innerHTML = "";

  if (items.length === 0) {

    results.innerHTML = `
      <div class="empty">
        月の記録には、該当する情報がありません。
      </div>
    `;

    return;
  }


  items.forEach(item => {

    const card = document.createElement("article");

    card.className = "result-card";

    const date =
      formatDate(item.date);

    card.innerHTML = `

      <div class="result-meta">
        ${escapeHtml(date)}
       　・　
        ${escapeHtml(item.category)}
      </div>

      <h3 class="result-title">

        <a
          href="${escapeAttribute(item.url)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${escapeHtml(item.title)}
        </a>

      </h3>

      ${
        item.summary
          ? `<p class="result-summary">
               ${escapeHtml(item.summary)}
             </p>`
          : ""
      }

      <div class="result-source">
        月の記録　／　
        ${escapeHtml(item.source)}
      </div>

    `;

    results.appendChild(card);

  });
}


/* =========================
   日付
========================= */

function formatDate(value) {

  if (!value) {
    return "日付不明";
  }

  const match =
    String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);

  if (!match) {
    return String(value);
  }

  return `${match[1]}年${Number(match[2])}月${Number(match[3])}日`;
}


/* =========================
   HTML安全処理
========================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function escapeAttribute(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}


/* =========================
   操作
========================= */

searchBox.addEventListener(
  "input",
  render
);

sortBox.addEventListener(
  "change",
  render
);


document.querySelectorAll(".nav button")
  .forEach(button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll(".nav button")
        .forEach(b =>
          b.classList.remove("active")
        );

      button.classList.add("active");

      currentFilter =
        button.dataset.filter;

      render();

      window.scrollTo({
        top: 350,
        behavior: "smooth"
      });

    });

  });


/* =========================
   開始
========================= */

loadData();

</script>

</body>
</html>
