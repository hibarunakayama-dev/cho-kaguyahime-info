<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超かぐや姫！情報センター</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
  background: #f7f6fc;
  color: #202038;
}

header {
  background: linear-gradient(135deg, #49318f, #7660d2);
  color: white;
  padding: 48px 24px 52px;
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 20px;
}

h1 {
  margin: 0;
  font-size: clamp(38px, 7vw, 64px);
  letter-spacing: 2px;
}

.subtitle {
  margin: 22px 0 0;
  font-size: clamp(18px, 3vw, 28px);
  opacity: 0.9;
}

main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 42px 24px 70px;
}

/* 集計 */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
  margin-bottom: 32px;
}

.stat {
  background: white;
  border-radius: 24px;
  padding: 30px;
  box-shadow: 0 8px 25px rgba(60, 40, 100, 0.08);
}

.stat-label {
  font-size: 20px;
  margin-bottom: 12px;
}

.stat-number {
  font-size: 44px;
  font-weight: bold;
}

/* 検索 */
.controls {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 18px;
  margin-bottom: 35px;
}

input,
select {
  width: 100%;
  padding: 18px 20px;
  border: 2px solid #e2dff0;
  border-radius: 16px;
  background: white;
  font-size: 18px;
  color: #202038;
}

input:focus,
select:focus {
  outline: none;
  border-color: #7660d2;
}

/* 説明 */
.info {
  background: #fff9dc;
  border: 1px solid #ead98b;
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 38px;
}

.info-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 10px;
}

/* NEWS */
.section-title {
  font-size: 32px;
  margin: 0 0 20px;
}

.news-list {
  display: grid;
  gap: 20px;
}

.news-card {
  background: white;
  border-radius: 22px;
  padding: 26px;
  box-shadow: 0 7px 22px rgba(60, 40, 100, 0.08);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.news-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(60, 40, 100, 0.13);
}

.news-top {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.date {
  font-weight: bold;
  color: #49318f;
  font-size: 17px;
}

.category {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 999px;
  background: #eeeafb;
  color: #49318f;
  font-size: 14px;
  font-weight: bold;
}

.new {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 999px;
  background: #fff0a8;
  color: #6d5600;
  font-size: 13px;
  font-weight: bold;
}

.news-title {
  margin: 0 0 12px;
  font-size: 23px;
  line-height: 1.55;
}

.news-summary {
  margin: 0 0 18px;
  color: #65657a;
  line-height: 1.7;
}

.source {
  color: #77778c;
  font-size: 14px;
  margin-bottom: 17px;
}

.news-link {
  display: inline-block;
  text-decoration: none;
  background: #49318f;
  color: white;
  padding: 12px 18px;
  border-radius: 12px;
  font-weight: bold;
}

.news-link:hover {
  background: #392474;
}

.empty {
  background: white;
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  color: #77778c;
}

.loading {
  text-align: center;
  padding: 40px;
}

.error {
  background: #fff0f0;
  border: 1px solid #e0aaaa;
  border-radius: 18px;
  padding: 25px;
  color: #8a2525;
}

footer {
  text-align: center;
  color: #9999aa;
  padding: 25px;
}

/* スマートフォン */
@media (max-width: 700px) {
  header {
    padding: 35px 20px 40px;
  }

  main {
    padding: 28px 16px 50px;
  }

  .stats {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .stat {
    padding: 22px;
  }

  .stat-number {
    font-size: 36px;
  }

  .controls {
    grid-template-columns: 1fr;
  }

  .news-card {
    padding: 21px;
  }

  .news-title {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">🌙 超かぐや姫！</div>
    <h1>情報センター</h1>
    <p class="subtitle">
      公式情報を中心に、ニュース・書籍・コミックなどを一目で確認
    </p>
  </div>
</header>

<main>

  <section class="stats">
    <div class="stat">
      <div class="stat-label">登録情報</div>
      <div class="stat-number" id="totalCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">表示中</div>
      <div class="stat-number" id="displayCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">情報源</div>
      <div class="stat-number" id="sourceCount">0</div>
    </div>
  </section>

  <section class="controls">
    <input
      id="searchInput"
      type="search"
      placeholder="🔎 情報を検索..."
      aria-label="情報を検索"
    >

    <select id="categorySelect" aria-label="カテゴリー">
      <option value="">すべてのカテゴリ</option>
    </select>
  </section>

  <section class="info">
    <div class="info-title">🔎 情報について</div>
    <div>
      この情報センターでは、確認できた公開情報を
      情報源URLとともに表示しています。
      公式NEWSの記事は公式サイトへのリンクから確認できます。
    </div>
  </section>

  <section>
    <h2 class="section-title">📰 公式NEWS</h2>

    <div id="loading" class="loading">
      情報を読み込んでいます……
    </div>

    <div id="error" class="error" style="display:none;"></div>

    <div id="newsList" class="news-list"></div>
  </section>

</main>

<footer>
  超かぐや姫！情報センター
</footer>

<script>
let allItems = [];

/* data.jsonを読み込む */
async function loadData() {
  const loading = document.getElementById("loading");
  const error = document.getElementById("error");

  try {
    const response = await fetch("./data.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("data.jsonを読み込めませんでした");
    }

    const data = await response.json();

    if (!Array.isArray(data.items)) {
      throw new Error("data.jsonのitemsが見つかりません");
    }

    allItems = data.items.slice();

    /* 新しい順 */
    allItems.sort((a, b) => {
      const da = new Date(a.date || "1900-01-01");
      const db = new Date(b.date || "1900-01-01");
      return db - da;
    });

    setupCategories();
    updateStats();
    render();

    loading.style.display = "none";

  } catch (e) {
    loading.style.display = "none";
    error.style.display = "block";
    error.textContent =
      "情報の読み込みに失敗しました。ページを再読み込みしてください。";
    console.error(e);
  }
}

/* カテゴリーを作る */
function setupCategories() {
  const select = document.getElementById("categorySelect");

  const categories = [
    ...new Set(
      allItems
        .map(item => item.category)
        .filter(Boolean)
    )
  ].sort();

  categories.forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    select.appendChild(option);
  });
}

/* 統計 */
function updateStats() {
  document.getElementById("totalCount").textContent =
    allItems.length;

  const sources = new Set(
    allItems
      .map(item => item.source)
      .filter(Boolean)
  );

  document.getElementById("sourceCount").textContent =
    sources.size;
}

/* 日付表示 */
function formatDate(dateString) {
  if (!dateString) return "";

  const date = new Date(dateString + "T00:00:00");

  if (Number.isNaN(date.getTime())) {
    return dateString;
  }

  return date.toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric"
  });
}

/* HTMLエスケープ */
function escapeHTML(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML;
}

/* 表示 */
function render() {
  const search =
    document.getElementById("searchInput").value
      .trim()
      .toLowerCase();

  const category =
    document.getElementById("categorySelect").value;

  const filtered = allItems.filter(item => {

    const text = [
      item.title,
      item.summary,
      item.source,
      item.category
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    const matchesSearch =
      !search || text.includes(search);

    const matchesCategory =
      !category || item.category === category;

    return matchesSearch && matchesCategory;
  });

  document.getElementById("displayCount").textContent =
    filtered.length;

  const list = document.getElementById("newsList");

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        該当する情報はありませんでした。
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map((item, index) => {

    const isNew = index < 3;

    return `
      <article class="news-card">

        <div class="news-top">

          <span class="date">
            ${escapeHTML(formatDate(item.date))}
          </span>

          ${
            item.category
              ? `<span class="category">
                  ${escapeHTML(item.category)}
                 </span>`
              : ""
          }

          ${
            isNew
              ? `<span class="new">新着</span>`
              : ""
          }

        </div>

        <h3 class="news-title">
          ${escapeHTML(item.title)}
        </h3>

        ${
          item.summary
            ? `<p class="news-summary">
                ${escapeHTML(item.summary)}
               </p>`
            : ""
        }

        ${
          item.source
            ? `<div class="source">
                情報源：${escapeHTML(item.source)}
               </div>`
            : ""
        }

        ${
          item.url
            ? `<a
                class="news-link"
                href="${escapeHTML(item.url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                公式NEWSを見る →
              </a>`
            : ""
        }

      </article>
    `;
  }).join("");
}

/* 検索 */
document
  .getElementById("searchInput")
  .addEventListener("input", render);

/* カテゴリー */
document
  .getElementById("categorySelect")
  .addEventListener("change", render);

/* 開始 */
loadData();
</script>

</body>
</html>
